<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <form action="" method="get" class="form-example">

        <div class="form-example">
            <label for="name">Enter Your Name:</label>
        <input type="text" id="name" name="name" placeholder="Your name" required /> 
        </div>

        <div class="form-example">
            <label for="email">Enter your Email:</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>

        <div class="form-example">
            <input type="submit" value="Subscribe!" />
        </div>

        <select id="select" multiple>
            <option value="blues" selected>Blues</option>
            <option value="rock" selected>Rock</option>
            <option value="jazz" selected>Jazz</option>
            <option value="classic" selected>Classic</option>
        </select>

        <script>

            let selected = Array.from(select.options)
            .filter(option => option.selected)
            .map(option => option.value);

            alert(selected); // blues, rock 
        </script>

    </form>

    <script> 
        const form = document.getElementById('myForm');
        form.addEventListener('submit', function(event) {
            const email = document.getElementById('email').value;
            const age = document.getElementById('age').value;
        
            if (!email || !age) {
                event.preventDefault();
                alert('Please fill out all fields to submit the form');

            }
            else if ( age < 18 || age > 120) {
                event.preventDefault();
                alert('Age must be between 18 and 120 to enter the contest');
            }
        });
    </script>

    <form id="form">
        <input name = "login">
    </form>

    <script>
        alert(form.elements.login == form.login); // true

        form.login.name = "username";   // Change the name of the input

        // form elements updated the name
        alert(form.element.login); // undefined
        alert(form.elements.username); // input

        // form allows both names: the new one and the old one
        alert(form.username == form.login); // true
    </script>   


    <style>
      input:invalid {
        border: 2px dashed red;
      }

      input:valid {
        border: 2px solid black;
      }
    </style>
  </head>

  <body>
    <form>
      <label for="choose">Would you prefer a banana or a cherry?</label>
      <input id="choose" name="i_like" />
      <button>Submit</button>
    </form>

    <label for="price">Choose a maximum house price: </label>
    <input 
    type="range"
    name="price"
    id="price"
    min="50000"
    max="500000"
    step="1000"
    value="250000" />
    <output class="price-output" for="price"></output>

    <form>
        <label for="mail">
            I would like to provide me with an email address:
        </label>

        <input type="email" id="mail" name="mail" required />
        <button> Submit </button>
    </form>

    <script>
        const mail = document.getElementById('mail');

        email.addEventListener('input', (event) => {
            if (email.validity.typeMismatch) {
                email.setCustomValidity('I am expecting to receive a correct email address!');

            }
            else {
                email.setCustomValidity('');
            }
        });
    </script>
  </body>
</html>
