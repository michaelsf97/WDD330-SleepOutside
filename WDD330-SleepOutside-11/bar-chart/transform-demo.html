<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Transform Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      padding: 2rem;
      background: #f5f5f5;
    }

    h1 { margin-bottom: 1.5rem; font-size: 2rem; }

    .demo-box {
      display: flex;
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow: hidden;
      background: white;
      max-width: 700px;
    }

    /* --- Left: list of examples --- */
    .examples {
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ccc;
      overflow-y: auto;
      max-height: 360px;
      min-width: 300px;
    }

    .examples button {
      text-align: left;
      background: none;
      border: none;
      border-bottom: 1px solid #eee;
      padding: 0.75rem 1rem;
      font-family: monospace;
      font-size: 0.9rem;
      color: #0060d1;
      cursor: pointer;
      transition: background 0.15s;
    }

    .examples button:hover { background: #f0f4ff; }
    .examples button.active { background: #dce8ff; font-weight: bold; }

    /* --- Right: preview --- */
    .preview {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 360px;
      background: #fafafa;
    }

    .preview-element {
      width: 80px;
      height: 80px;
      background: #ff6600;
      border-radius: 8px;
      transition: transform 0.4s ease;
    }

    /* --- Reset button --- */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 1rem;
      border-bottom: 1px solid #ccc;
      background: #f9f9f9;
    }

    .header span { font-size: 0.9rem; color: #555; }

    .header button {
      padding: 0.3rem 0.8rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: white;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .header button:hover { background: #eee; }

    /* Wrap header + demo-box */
    .card {
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow: hidden;
      max-width: 700px;
    }

    .card .demo-box {
      border: none;
      border-radius: 0;
    }
  </style>
</head>
<body>
  <h1>Try it — CSS transform</h1>

  <div class="card">
    <div class="header">
      <span>CSS Demo: transform</span>
      <button id="resetBtn">Reset</button>
    </div>

    <div class="demo-box">
      <div class="examples" id="examples">
        <button data-transform="matrix(1, 2, 0.5, 2, 100, 0)">transform: matrix(1, 2, 0.5, 2, 100, 0)</button>
        <button data-transform="translate(120px, 50%)">transform: translate(120px, 50%)</button>
        <button data-transform="scale(2, 0.5)">transform: scale(2, 0.5)</button>
        <button data-transform="rotate(0.5turn)">transform: rotate(0.5turn)</button>
        <button data-transform="skew(30deg, 20deg)">transform: skew(30deg, 20deg)</button>
        <button data-transform="scale(0.5) translate(-100%, -100%)">transform: scale(0.5) translate(-100%, -100%)</button>
        <button data-transform="rotate(45deg) scale(1.3)">transform: rotate(45deg) scale(1.3)</button>
        <button data-transform="perspective(500px) rotateY(30deg)">transform: perspective(500px) rotateY(30deg)</button>
      </div>

      <div class="preview">
        <div class="preview-element" id="previewEl"></div>
      </div>
    </div>
  </div>

  <script>
    const previewEl = document.getElementById('previewEl');
    const resetBtn = document.getElementById('resetBtn');
    const buttons = document.querySelectorAll('#examples button');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        previewEl.style.transform = btn.dataset.transform;
      });
    });

    resetBtn.addEventListener('click', () => {
      previewEl.style.transform = 'none';
      buttons.forEach(b => b.classList.remove('active'));
    });
  </script>
</body>
</html>
